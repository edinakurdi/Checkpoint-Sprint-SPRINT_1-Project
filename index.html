<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared bookmarks</title>
    <script type="module" src="script.js"></script>
    <script type="module" src="form.js"></script>
  </head>

  <body>
    <header>
      <h1>Shared Bookmarks</h1>
      <p>
        Save links worth coming back to, and see what other people have saved.
      </p>
    </header>

    <main>
      <section>
        <label for="user-selection">Choose a user</label>
        <select name="selected-user" id="user-selection">
          <!-- TODO Edina - JS to inject <options> here using getUserIds() -->
        </select>
      </section>

      <section id="bookmarks-display-section">
        <h2 id="bookmark-heading">Bookmarks</h2>
        <p id="empty-message" hidden>
          This user hasn't saved any bookmarks yet.
        </p>
        <!-- empty state - todo Edina - js to remove hidden when no bookmarks yet -->
        <ul id="bookmark-list"></ul>
        <!-- todo Edina - JS to add <li> for each bookmark -->

        <!-- todo -Dona DELETE this comment, im just explaining what i did:
      "toast" - is used for temporary notification in the UI such as "added to basket" or "changes saved" etc;
      aria-live="polite" tells the screen-reader to announce changes when it has finished speaking (so does not interrupt the user) 
      -->
        <p id="copy-status" class="toast" aria-live="polite"></p>
      </section>

      <section area-labelledby="add-bookmark-heading">
        <h2 id="add-bookmark-heading">Add a bookmark</h2>
        <form id="bookmark-form">
          <label for="bookmark-url">URL</label>
          <input
            id="bookmark-url"
            type="text"
            aria-describedby="bookmark-url-error"
          />
          <p id="bookmark-url-error"></p>
          <label for="bookmark-title">Title</label>
          <input
            id="bookmark-title"
            type="text"
            aria-describedby="bookmark-title-error"
          />
          <p id="bookmark-title-error"></p>
          <label for="bookmark-description">Description</label>
          <textarea
            id="bookmark-description"
            aria-describedby="bookmark-description-error"
          ></textarea>
          <p id="bookmark-description-error"></p>
          <button type="submit">Add bookmark</button>
        </form>
      </section>

      <template id="bookmark-template">
        <li>
          <h3><a class="bookmark-link" href=""></a></h3>
          <p class="bookmark-description"></p>
          <p>Saved: <time class="bookmark-date"></time></p>
          <button type="button" class="copy-button">Copy URL</button>
          <!-- todo Dona - like button + counter to add here-->
        </li>
      </template>
    </main>

    <footer></footer>
  </body>
</html>
